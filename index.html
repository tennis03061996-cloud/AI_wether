<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>独自AI 予測アセンブラ (NWP + 観測)</title>
    <!-- ご指定のアイコン設定 -->
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3093/3093395.png" type="image/png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3093/3093395.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #f8fafc; font-family: 'Helvetica Neue', Arial, sans-serif; }
        .spinner {
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800">

<div class="max-w-5xl mx-auto p-6">
    <header class="mb-8 border-b-2 border-blue-500 pb-4">
        <h1 class="text-3xl font-bold text-blue-900">独自AI 予測アセンブラ</h1>
        <p class="text-gray-600 mt-2">最新の「数値予報資料」と「実況データ」を入力してAIに予測を組み立てさせます。</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- 入力フォームエリア -->
        <div class="bg-white p-6 rounded-xl shadow border border-gray-200">
            <h2 class="text-xl font-bold mb-4 text-gray-700">最新データの入力</h2>
            
            <div class="space-y-4">
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                    <h3 class="font-bold text-blue-800 mb-2">📡 最新の数値予報資料 (NWP)</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-gray-600">海面気圧 (hPa)</label>
                            <input type="number" id="nwp_pressure" value="1010" class="w-full border rounded p-2 mt-1">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600">予想気温 (℃)</label>
                            <input type="number" id="nwp_temp" value="22.5" class="w-full border rounded p-2 mt-1">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm text-gray-600">予想降水確率 (%)</label>
                            <input type="number" id="nwp_pop" value="30" class="w-full border rounded p-2 mt-1">
                        </div>
                    </div>
                </div>

                <div class="bg-green-50 p-4 rounded-lg border border-green-100">
                    <h3 class="font-bold text-green-800 mb-2">📍 最新の実況データ (SFC_H / AMD_D)</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-gray-600">現在の実況気温 (℃)</label>
                            <input type="number" id="obs_current_temp" value="23.0" class="w-full border rounded p-2 mt-1">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600">現在の実況風速 (m/s)</label>
                            <input type="number" id="obs_current_wind" value="3.5" class="w-full border rounded p-2 mt-1">
                        </div>
                    </div>
                </div>

                <button id="predictBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg flex justify-center items-center gap-2 transition">
                    <span id="btnText">このデータでAI予測を組み立てる</span>
                    <div id="loadingSpinner" class="spinner border-t-white"></div>
                </button>
                <div id="errorMsg" class="text-red-500 text-sm hidden">Pythonサーバー(127.0.0.1:5000)に接続できません。起動しているか確認してください。</div>
            </div>
        </div>

        <!-- 予測結果エリア -->
        <div class="bg-white p-6 rounded-xl shadow border border-gray-200 flex flex-col">
            <h2 class="text-xl font-bold mb-4 text-gray-700">AIによる詳細予測結果 (数時間後)</h2>
            
            <div id="resultBox" class="flex-grow flex flex-col justify-center hidden">
                <div class="grid grid-cols-1 gap-4">
                    <div class="bg-gray-50 border p-4 rounded-lg flex justify-between items-center">
                        <span class="text-gray-500 font-bold">AI補正 予想気温</span>
                        <div class="text-3xl font-black text-gray-800"><span id="resTemp">-</span><span class="text-lg font-normal ml-1">℃</span></div>
                    </div>
                    <div class="bg-gray-50 border p-4 rounded-lg flex justify-between items-center">
                        <span class="text-gray-500 font-bold">AI補正 降水確率</span>
                        <div class="text-3xl font-black text-blue-600"><span id="resPop">-</span><span class="text-lg font-normal ml-1">%</span></div>
                    </div>
                    <div class="bg-gray-50 border p-4 rounded-lg flex justify-between items-center">
                        <span class="text-gray-500 font-bold">推定最大風速</span>
                        <div class="text-3xl font-black text-gray-800"><span id="resWind">-</span><span class="text-lg font-normal ml-1">m/s</span></div>
                    </div>
                </div>
                <div class="mt-6 text-sm text-blue-600 bg-blue-50 p-3 rounded text-center font-bold" id="statusMsg"></div>
            </div>
            
            <div id="waitBox" class="flex-grow flex items-center justify-center text-gray-400">
                左のフォームからデータを入力してください
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const btn = document.getElementById('predictBtn');
    const spinner = document.getElementById('loadingSpinner');
    const btnText = document.getElementById('btnText');
    const resultBox = document.getElementById('resultBox');
    const waitBox = document.getElementById('waitBox');
    const errorMsg = document.getElementById('errorMsg');

    btn.addEventListener('click', async () => {
        btn.disabled = true;
        spinner.style.display = 'block';
        btnText.innerText = 'AIで推論中...';
        errorMsg.classList.add('hidden');

        // 入力値の取得
        const payload = {
            nwp_pressure: document.getElementById('nwp_pressure').value,
            nwp_temp: document.getElementById('nwp_temp').value,
            nwp_pop: document.getElementById('nwp_pop').value,
            obs_current_temp: document.getElementById('obs_current_temp').value,
            obs_current_wind: document.getElementById('obs_current_wind').value
        };

        try {
            // Pythonバックエンドへリクエスト送信
            const response = await fetch('http://127.0.0.1:5000/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error('Network response was not ok');
            
            const data = await response.json();

            // 結果の反映
            document.getElementById('resTemp').innerText = data.predicted_temp;
            document.getElementById('resPop').innerText = data.predicted_pop;
            document.getElementById('resWind').innerText = data.predicted_wind;
            document.getElementById('statusMsg').innerText = data.message;

            waitBox.classList.add('hidden');
            resultBox.classList.remove('hidden');

        } catch (error) {
            console.error('Error:', error);
            errorMsg.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            spinner.style.display = 'none';
            btnText.innerText = 'このデータでAI予測を組み立てる';
        }
    });
})();
</script>
</body>
</html>
